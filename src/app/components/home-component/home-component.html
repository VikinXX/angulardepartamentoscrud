<h1>Home!!!</h1>

@if(departamentos.length > 0){
    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>Número</th>
                <th>Nombre</th>
                <th>Localidad</th>
            </tr>
        </thead>
        <tbody>
            @for(dep of departamentos; track dep){
                <tr>
                    <td>{{dep.numero}}</td>
                    <td>{{dep.nombre}}</td>
                    <td>{{dep.localidad}}</td>
                </tr>
            }
        </tbody>
    </table>
}
