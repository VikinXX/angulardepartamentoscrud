<h1>Insertar Departamento</h1>
<form #formulario="ngForm" (ngSubmit)="insertarDepartamento()">
    <label>Numero: <input name="numero" type="text" #numero class="form-control"/></label>
    <br>
    <label>Nombre: <input name="nombre" type="text" #nombre class="form-control"/></label>
    <br>
    <label>Localidad: <input name="localidad" type="text" #localidad class="form-control"/></label>
    <br>
    <button class="btn btn-primary">Insertar</button>
</form>

@if(insertado){
    <h1 style="color: green;">Departamento Insertado!!!!!!!</h1>
}
